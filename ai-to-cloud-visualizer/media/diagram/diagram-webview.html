<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} https: data:; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';">
    <title>D2 Visualizer</title>
    <link rel="stylesheet" href="{{styleUri}}">
</head>
<body>
    <div class="shell">
        <div class="header">
            <div class="header-left">
                <div class="title">D2 Visualizer</div>
                <div class="status" id="status">Press Reload / Compile after editing the .d2 file.</div>
            </div>
            <div class="toolbar">
                <button class="reload-btn primary" id="updateBtn" type="button">Update (MCP)</button>
                <button class="reload-btn primary" id="updateVscodeBtn" type="button">Update (Copilot)</button>
                <button class="reload-btn" id="reloadBtn" type="button">Reload / Compile</button>
                <div class="status" id="activePromptDisplay">{{currentPromptLabel}}</div>
                <button class="reload-btn icon-btn" id="selectPromptBtn" type="button" title="Select Prompt Template" aria-label="Select Prompt Template">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2 2.83 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 1.65 1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                </button>
            </div>
        </div>
        <div class="stage">
            <div class="diagram svg-wrap" id="diagram"></div>
        </div>
    </div>
    <script nonce="{{nonce}}">
        window.__DIAGRAM_INITIAL_STATE__ = {{initialState}};
    </script>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
</body>
</html>
