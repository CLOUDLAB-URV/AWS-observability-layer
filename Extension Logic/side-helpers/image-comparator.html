<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Comparador de Portapapeles</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 20px;
            background-color: #f0f2f5;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            max-width: 100%;
        }
        .box {
            border: 3px dashed #ccc;
            border-radius: 8px;
            min-width: 300px;
            min-height: 300px;
            max-width: 45vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            overflow: hidden;
        }
        img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
        }
        p { color: #666; font-size: 1.1em; }
    </style>
</head>
<body>
    <p>Haz clic en cualquier parte de la página y presiona <strong>Ctrl + V</strong> para pegar la primera imagen, luego hazlo otra vez para la segunda.</p>
    <div class="container">
        <div class="box" id="box1">Espera de Imagen 1...</div>
        <div class="box" id="box2">Espera de Imagen 2...</div>
    </div>

    <script>
        let toggle = true;
        window.addEventListener('paste', e => {
            const items = (e.clipboardData || e.originalEvent.clipboardData).items;
            for (let item of items) {
                if (item.type.indexOf('image') === 0) {
                    const blob = item.getAsFile();
                    const url = URL.createObjectURL(blob);
                    const img = document.createElement('img');
                    img.src = url;
                    
                    if (toggle) {
                        const b1 = document.getElementById('box1');
                        b1.innerHTML = '';
                        b1.appendChild(img);
                    } else {
                        const b2 = document.getElementById('box2');
                        b2.innerHTML = '';
                        b2.appendChild(img);
                    }
                    toggle = !toggle; // Alterna para el siguiente pegado
                }
            }
        });
    </script>
</body>
</html>
